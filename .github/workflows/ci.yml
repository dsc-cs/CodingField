name: CI + Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Smoke test
        run: |
          [ -s index.html ] || { echo "index.html is missing or empty"; exit 1; }
          grep -q "CodingField" index.html || { echo "marker not found"; exit 1; }
          echo "index.html OK"

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render
        run: |
          mkdir -p deploy
          sed -e "s|{{ SHA }}|${{ github.sha }}|g" index.html > deploy/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: deploy
      - uses: actions/deploy-pages@v4
