name: CI + Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: pip install --quiet pytest
      - name: Run tests
        run: pytest -v
      - name: Run JS calculator test
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Node smoke test
        run: node test_calc.js
      - name: Sanity check
        run: |
          [ -s index.html ] || { echo "index.html missing/empty"; exit 1; }
          grep -q "Calculator" index.html || { echo "calculator marker not found"; exit 1; }
          echo "index.html OK"

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render
        run: |
          mkdir -p deploy
          sed -e "s|{{ SHA }}|${{ github.sha }}|g" index.html > deploy/index.html
          cat weather.html | sed -e "s|{{ SHA }}|${{ github.sha }}|g" > deploy/weather.html
          cp calc.js deploy/calc.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: deploy
      - uses: actions/deploy-pages@v4
